<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support Eliyas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="top-space"></div>

      <h1>Support Eliyas</h1>
      <p class="subtitle">Choose an amount to support me</p>

      <div class="amounts">
        <button class="amount" data-amount="25"><span>ETB</span> 25</button>
        <button class="amount" data-amount="50"><span>ETB</span> 50</button>
        <button class="amount" data-amount="100"><span>ETB</span> 100</button>
        <button class="amount" data-amount="250"><span>ETB</span> 250</button>
        <button class="amount" data-amount="500"><span>ETB</span> 500</button>
        <button class="amount" data-amount="1000"><span>ETB</span> 1,000</button>
      </div>

      <label class="label" for="amount">Amount</label>
      <div class="input-wrap">
        <span>ETB</span>
        <input id="amount" type="number" min="1" step="1" placeholder="Enter your own amount">
      </div>

      <div class="toggle-row">
        <div>
          <strong>Show my name &amp; message</strong>
          <small>Optional</small>
        </div>
        <label class="switch">
          <input id="showInfo" type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div id="infoFields">
        <label class="label" for="name">Your name</label>
        <input id="name" type="text" placeholder="Your name">

        <label class="label" for="message">Message <span>(optional)</span></label>
        <textarea id="message" maxlength="200" placeholder="Say something nice..."></textarea>
        <div class="counter"><span id="count">0</span>/200</div>
      </div>

      <button id="pay" class="continue">Continue</button>
      <p id="status" class="status"></p>
      <p class="secure">Secure checkout powered by Chapa</p>
    </section>
  </main>

<script>
const amountInput = document.getElementById("amount");
const status = document.getElementById("status");
const pay = document.getElementById("pay");
const message = document.getElementById("message");
const count = document.getElementById("count");
const showInfo = document.getElementById("showInfo");
const infoFields = document.getElementById("infoFields");

document.querySelectorAll(".amount").forEach(btn => {
  btn.addEventListener("click", () => {
    amountInput.value = btn.dataset.amount;
    document.querySelectorAll(".amount").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
  });
});

amountInput.addEventListener("input", () => {
  document.querySelectorAll(".amount").forEach(b => {
    b.classList.toggle("selected", Number(b.dataset.amount) === Number(amountInput.value));
  });
});

message.addEventListener("input", () => {
  count.textContent = message.value.length;
});

showInfo.addEventListener("change", () => {
  infoFields.style.display = showInfo.checked ? "block" : "none";
});

pay.addEventListener("click", async () => {
  status.textContent = "";
  const amount = Number(amountInput.value);

  if (!Number.isFinite(amount) || amount < 1) {
    status.textContent = "Please enter a valid amount.";
    return;
  }

  pay.disabled = true;
  pay.textContent = "Please wait...";

  try {
    const r = await fetch("/api/pay", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        amount,
        first_name: showInfo.checked ? document.getElementById("name").value : "Supporter",
        email: showInfo.checked ? document.getElementById("email").value : "supporter@gmail.com",
        
        
        message: showInfo.checked ? message.value : ""
      })
    });

    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Payment could not be started.");

    window.location.href = data.checkout_url;
  } catch (e) {
    status.textContent = e.message;
    pay.disabled = false;
    pay.textContent = "Continue";
  }
});
</script>
</body>
</html>
